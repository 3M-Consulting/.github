name: Segnala un difetto
description: Il sistema si comporta in modo diverso da quello atteso.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: >-
        Il titolo descrive l'esito atteso, non l'attività. Un difetto che espone dati o credenziali
        non si apre qui: segui [SECURITY.md](https://github.com/3M-Consulting/.github/blob/main/SECURITY.md).
        Le regole complete sono nella sezione Issue di
        [CONTRIBUTING.md](https://github.com/3M-Consulting/.github/blob/main/CONTRIBUTING.md).
  - type: textarea
    id: observed
    attributes:
      label: Comportamento osservato
      description: >-
        Che cosa succede. In un repository di codice almeno un percorso reale in forma `file:riga`;
        altrove un link o un fatto verificabile. Messaggi di errore e `error_code` così come
        compaiono.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Comportamento atteso
      description: Come si comporta il sistema quando la issue è chiusa.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Come riprodurre
      description: I passi minimi, con gli identificativi tecnici delle entità coinvolte.
      placeholder: |
        1. …
        2. …
  - type: textarea
    id: acceptance
    attributes:
      label: Criteri di accettazione
      description: >-
        Un elenco puntato, senza caselle, di criteri verificabili — un comando, un test, un esito
        osservabile. L'evidenza di ogni criterio va nella PR, sezione «Come è stato verificato».
    validations:
      required: true
  - type: textarea
    id: files
    attributes:
      label: File toccati e documento da aggiornare
      description: I file che cambieranno e il documento che possiede l'informazione toccata.
  - type: checkboxes
    id: privacy
    attributes:
      label: Dati personali
      options:
        - label: Non ho incollato dati personali di clienti o dipendenti, solo identificativi tecnici.
          required: true
